server {
    listen 80;

    # 화면(정적 파일): nginx가 직접 응답
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # 데이터 요청: API 서버로 전달 (Docker 내부 이름 api:8000)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SSE는 연결을 오래 열어 두고 조금씩 흘려보낸다 -> 버퍼링/타임아웃을 꺼야 이벤트가 즉시 도착한다
    location /api/events {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
